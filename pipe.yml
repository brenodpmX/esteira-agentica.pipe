log:
  dir: logs
  ttl: 60
  level: INFO

git:
  repo:
    main: git@github.com:brenotmp-agent/pipe.git

  flow:
    base: main

    hotfix:
      prefix: hotfix
      description: Usada para correção de bugs em produção
      create: main
      merge: main

    epic:
      prefix: epic
      description: Branch para épicos — planejamento e documentação
      create: main
      merge: main
    story:
      prefix: story
      description: Branch para épicos — planejamento e documentação
      create: epic
      merge: epic
    feature:
      prefix: feature
      description: Branch de feature de desenvolvimento
      create: epic
      merge: epic


