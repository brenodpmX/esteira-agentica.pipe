project:
  name: "Esteira Agêntica"
  summary: "Esteira de desenvolvimento orientada a issues: agentes de IA conduzem épicos, stories, tasks, bugs e incidentes pelos boards, do backlog à produção, com portões humanos nas colunas de aprovação."
  humans:
    - name: Breno
      role: "dono do produto; aprova negócio e homologa entregas"

sleep: 1800

log:
  dir: logs
  ttl: 60
  level: INFO

git:
  repo:
    main: git@github.com:brenodpmX/esteira-agentica.git

  flow:
    base: main

    hotfix:
      prefix: hotfix
      branch_pattern: "hotfix/<id>-<slug>"
      description: Usada para correção de bugs em produção
      create: main
      merge: main

    docs:
      prefix: docs
      branch_pattern: "docs/<id>-<slug>"
      description: Branch de documentação (incidente e postmortem), main→main
      create: main
      merge: main

    epic:
      prefix: epic
      branch_pattern: "epic/<id>-<slug>"
      description: Branch para épicos — planejamento e documentação
      create: main
      merge: main
    story:
      prefix: story
      branch_pattern: "story/<id>-<slug>"
      description: Branch para épicos — planejamento e documentação
      create: epic
      merge: epic
    feature:
      prefix: feature
      branch_pattern: "feature/<id>-<slug>"
      description: Branch de feature de desenvolvimento
      create: epic
      merge: epic


agents:
  kiro-cli:
    product:
      name: Helena Costa - Product Manager
      model: gpt-5.6-sol
    requirements:
      name: Rafael Martins - Analista de Requisitos
      model: claude-sonnet-5
    architecture:
      name: Lucas Almeida - Arquiteto de Software
      model: gpt-5.6-sol
    tech-lead:
      name: Isabela Gomes - Tech Lead
      model: claude-sonnet-5
    reviewer:
      name: Bruno Ferreira - Engenheiro de Software SR
      model: claude-sonnet-5
    engineering-sr:
      name: Bruno Ferreira - Engenheiro de Software SR
      model: claude-opus-5
    engineering-pl:
      name: Sofia Carvalho - Engenheira de Software PL
      model: auto
    engineering-jr:
      name: Laura Azevedo - Engenheira de Software JR
      model: claude-haiku-4.5
    quality:
      name: Camila Rocha - Engenheira de Qualidade (QA)
      model: claude-sonnet-5
    generic:
      name: Diego Santos - Analista de Operações
      model: claude-haiku-4.5




boards:
  platform: github
  rerun_cooldown: 1800

  epic:
    name: "Pipe - Epics"
    desc: "Épicos: negócio → requisitos → arquitetura → stories"
    todo: backlog
    priority: 5
    flow: epic
    parallel: true
    columns:
      backlog:
        name: Backlog
        change:
          advance: analise-negocio
          cancelar: cancelado
      analise-negocio:
        name: "Análise de Negócio"
        agent: product
        gitevents: create
        target-prompt: |-
          Definir a proposta de negócio do épico — problema, valor, escopo e viabilidade — a ponto de sustentar a decisão de construir (ou não), com o corpo da issue refletindo o que será construído.
        step-prompt: |-
          - Construa a proposta junto com o dono, dialogando pelo history/addcomment: o que ele traz é ponto de partida a validar (com fatos, dados e mercado), não verdade pronta — e não presuma respostas por ele; sinalize espera com `need_human`.
          - Pesquise mercado, alternativas e o custo de não fazer; onde faltar prova, pergunte ou pesquise, não suponha.
          - Alinhem dor, retorno (e como medi-lo), ordem de esforço e aderência a metas e políticas.
          - Baseie a documentação nos templates (`vision.md`, `problem-space.md`, `epicos.md`) e reescreva o corpo da issue conforme `epic.md`.
          - Não decida tecnologia/arquitetura nem crie stories.
        change:
          advance: aprovacao-negocio
      aprovacao-negocio:
        name: "Aprovação Negócio"
        on_in: [need_human]
        on_out: [-need_human]
      requisitos:
        name: "Requisitos"
        agent: requirements
        gitevents: create
        target-prompt: |-
          Ter um baseline de requisitos do épico inequívoco — funcionais, regras de negócio, NFRs mensuráveis e padrão de aceitação — que arquitetura e a quebra em stories consumam sem suposições, com o corpo da issue refletindo o escopo acordado.
        step-prompt: |-
          - Cubra a documentação de negócio aprovada antes de perguntar; identifique lacunas, ambiguidades e regras implícitas e priorize por risco.
          - Alinhe com o cliente pelo history/addcomment quantas rodadas precisar (sinalize espera com `need_human`; não presuma respostas); pesquise fonte externa atual quando o dado não vier dele.
          - Especifique requisitos funcionais (atores, dados, fluxos principais/alternativos), regras de negócio, NFRs mensuráveis e o padrão de aceitação (Dado/Quando/Então).
          - Garanta cada requisito não ambíguo, completo, consistente, necessário e testável isoladamente; contradição entre artefatos → pare e sinalize.
          - Baseie os artefatos nos templates (`functional-requirements.md`, `business-rules.md`, `non-functional-requirements.md`, `glossary.md`).
          - Não defina arquitetura/tecnologia, não prototipe, não quebre em stories, não implemente.
        change:
          advance: validacao-negocial
      validacao-negocial:
        name: "Validação Negocial"
        on_in: [need_human]
        on_out: [-need_human]
      arquitetura:
        name: "Arquitetura"
        agent: architecture
        gitevents: use
        target-prompt: |-
          Ter a arquitetura do projeto definida e documentada — simples e aderente aos requisitos — pronta para guiar a quebra em stories e o desenvolvimento.
        step-prompt: |-
          - Parta dos requisitos e verifique a documentação arquitetural já existente; busque padrões compatíveis com o projeto.
          - Prefira o simples que funciona; evite arquitetura elaborada demais ou a "modinha da vez".
          - Crie e/ou atualize a documentação arquitetural, baseada nos templates (`architecture-overview.md`, `constraints.md`, `adr.md`).
        change:
          advance: validacao-arquitetura
      validacao-arquitetura:
        name: "Validação Arquitetural"
        on_in: [need_human]
        on_out: [-need_human]
      criacao-stories:
        name: "Criação de User Stories"
        agent: tech-lead
        gitevents: use
        target-prompt: |-
          Decompor o épico aprovado em user stories que cubram todo o escopo, sem sobreposição e sem deixar parte órfã, prontas para o planejamento técnico.
        step-prompt: |-
          - Derive as stories da documentação aprovada (negócio, requisitos, arquitetura); cada story é uma fatia entregável de valor, não um recorte técnico.
          - Crie cada story apenas no board 'story' (coluna de entrada), com contexto suficiente para ser conduzida sozinha; baseie-se no template `user-story.md`.
          - Em cada story, registre este épico como pai e faça a story bloquear este épico (a story segura o épico até concluir).
          - Havendo dependência entre stories, crie-as na ordem de execução.
          - Não detalhe tasks técnicas aqui.
        change:
          advance: aguardando-stories
      aguardando-stories:
        name: "Aguardando Stories"
        agent: generic
        gitevents: use
        target-prompt: |-
          Garantir que toda story filha esteja bloqueando este épico e manter o épico parado enquanto houver filha ativa.
        step-prompt: |-
          - Liste as stories filhas deste épico (as que registram este épico como pai).
          - Para cada filha ainda aberta que não esteja bloqueando o épico, adicione o id dela em `/blocked_by` deste épico (nesta etapa a filha já tem id).
          - Se alguma filha foi duplicada indevidamente neste board 'epic', remova apenas a cópia daqui (a válida é a do board 'story').
          - Enquanto houver filha aberta, não avance; quando todas concluírem, avance.
        change:
          advance: pre-prod
      pre-prod:
        name: "Pré produção"
        agent: tech-lead
        gitevents: use
        target-prompt: |-
          Ter o ambiente pré-produtivo do épico pronto para o humano homologar — branch integrada com a `main`, íntegra, e com instruções claras de execução.
        step-prompt: |-
          - Traga a `main` para a branch do épico (merge) e resolva os conflitos.
          - Valide que todas as mudanças estão presentes e íntegras após a integração.
          - Prepare o ambiente pré-produtivo (docker compose) para homologação.
          - Escreva orientações detalhadas de como executar o ambiente pré-produtivo.
          - Informe quais mudanças estão sendo homologadas (resumo do que será validado).
        change:
          advance: homologacao
      homologacao:
        name: "Homologação"
        on_in: [need_human]
        on_out: [-need_human]
      documentacao:
        name: "Documentação"
        agent: tech-lead
        gitevents: use
        target-prompt: |-
          Ter versão, README, documentações públicas e change files atualizados, refletindo as mudanças entregues no épico.
        change:
          advance: merge-request
      merge-request:
        name: "Merge Request"
        agent: generic
        gitevents: merge
        target-prompt: |-
          Ter o merge request da issue aberto (da branch de trabalho para a branch de destino), refletindo os commits atuais.
        step-prompt: |-
          - Se já houver MR aberto para esta branch (retrabalho), não crie outro: confirme que reflete os commits atuais e prossiga.
        change:
          advance: code-review
      code-review:
        name: "Code Review"
        agent: reviewer
        target-prompt: |-
          Servir de portão de qualidade do épico antes da integração: se aprovado, épico integrado; se reprovado, épico devolvido com um bug bloqueante e apontamentos claros.
        step-prompt: |-
          - Revise o MR: boas práticas, padrões de arquitetura, code-smell, aderência ao solicitado, ausência de delírio, se compila, cobertura de testes conforme especificado e legibilidade (baixa complexidade).
          - Aprovado: conclua o merge e avance.
          - Reprovado: crie um bug no board 'bug' (coluna de entrada) seguindo `bug.md`, descrevendo o problema; preencha as Referências (Issue original = este épico; Branch original = a branch deste épico); faça o bug bloquear este épico; adicione a label 'retrabalho' ao épico e avance para correcao.
          - Ao reanalisar, não remova a label 'retrabalho'.
        change:
          correcao: aguardando-stories
          advance: report-negocial
      report-negocial:
        name: "Report Negocial"
        agent: tech-lead
        target-prompt: |-
          Ter um report negocial do que foi para produção neste épico — funcionalidades, melhorias, correções e débitos técnicos remanescentes — registrado no addcomment.
        step-prompt: |-
          - Levante tudo que foi implantado: novas funcionalidades, melhorias e correções; inclua os débitos técnicos que ficaram, se houver.
          - Escreva o report no addcomment em linguagem exclusivamente negocial, evitando termos técnicos.
        change:
          advance: em-produção
      em-produção:
        name: "Em produção"
        on_in: [need_human]
        on_out: [-need_human]
      concluido:
        name: "Concluído"
        agent: generic
        target-prompt: |-
          A issue sem nenhuma relação de bloqueio, liberando quem dependia dela.
        on_out: [completed]
        change:
          advance: encerrado
      cancelado:
        name: "Cancelado"
        agent: generic
        target-prompt: |-
          A issue cancelada e limpa: filhas canceladas, sem relações de bloqueio e sem branch remanescente.
        step-prompt: |-
          - Mova todas as issues filhas desta para 'cancelado' no board de cada uma.
          - Remova todas as relações de bloqueio desta issue.
          - Remova a branch (local e remota).
        on_out: [not_planned]
        change:
          advance: encerrado
      encerrado:
        name: "Encerrado"
        on_in: [archive]
        on_out: [-archive]
  
  story:
    name: "Pipe - User Stories"
    desc: "User stories: planejamento técnico → tasks → integração"
    todo: backlog
    priority: 4
    parallel: false
    flow: story
    columns:
      backlog:
        name: Backlog
        change:
          advance: planejamento-tecnico
          cancelar: cancelado
      planejamento-tecnico:
        name: "Planejamento Técnico"
        agent: tech-lead
        gitevents: use
        target-prompt: |-
          Transformar a story aprovada em um plano dividido em tasks técnicas — entregáveis, testáveis isoladamente e sem ambiguidade — até restar apenas implementar.
        step-prompt: |-
          - A partir das documentações (negocial e arquitetural), defina o plano e quebre-o em tasks.
          - Crie cada task apenas no board 'task' (coluna de entrada), seguindo o template `task.md`; entregável, testável isoladamente e redigida para uma IA executar sem ambiguidade.
          - Em cada task, registre esta story como pai e faça a task bloquear esta story (a task segura a story até concluir).
          - Havendo dependência entre tasks, crie-as na ordem de execução.
          - Não implemente aqui nem deixe task vaga ou dependente de contexto não escrito.
        change:
          advance: aguardando-tasks
      aguardando-tasks:
        name: "Aguardando Tasks"
        agent: generic
        gitevents: use
        target-prompt: |-
          Garantir que toda task filha esteja bloqueando esta story e manter a story parada enquanto houver filha ativa.
        step-prompt: |-
          - Liste as tasks filhas desta story (as que registram esta story como pai).
          - Para cada filha ainda aberta que não esteja bloqueando a story, adicione o id dela em `/blocked_by` desta story (nesta etapa a filha já tem id).
          - Se alguma filha foi duplicada indevidamente neste board 'story', remova apenas a cópia daqui (a válida é a do board 'task').
          - Enquanto houver filha aberta, não avance; quando todas concluírem, avance.
        change:
          advance: change-file
      change-file:
        name: "Change File"
        agent: tech-lead
        gitevents: use
        target-prompt: |-
          Ter o change file da story criado, registrando todas as alterações entregues nela.
        change:
          advance: merge-request
      merge-request:
        name: "Merge Request"
        agent: generic
        gitevents: merge
        target-prompt: |-
          Ter o merge request da issue aberto (da branch de trabalho para a branch de destino), refletindo os commits atuais.
        step-prompt: |-
          - Se já houver MR aberto para esta branch (retrabalho), não crie outro: confirme que reflete os commits atuais e prossiga.
        change:
          advance: code-review
      code-review:
        name: "Code Review"
        agent: reviewer
        target-prompt: |-
          Servir de portão de qualidade da story antes da integração: se aprovada, story integrada; se reprovada, story devolvida com um bug bloqueante e apontamentos claros.
        step-prompt: |-
          - Revise o MR: boas práticas, padrões de arquitetura, code-smell, aderência ao solicitado, ausência de delírio, se compila, cobertura de testes conforme especificado e legibilidade (baixa complexidade).
          - Aprovado: conclua o merge e avance.
          - Reprovado: crie um bug no board 'bug' (coluna de entrada) seguindo `bug.md`, descrevendo o problema; preencha as Referências (Issue original = esta story; Branch original = a branch desta story); faça o bug bloquear esta story; adicione a label 'retrabalho' à story e avance para correcao.
          - Ao reanalisar, não remova a label 'retrabalho'.
        change:
          advance: concluido
          correcao: aguardando-tasks
      concluido:
        name: "Concluído"
        agent: generic
        target-prompt: |-
          A issue sem nenhuma relação de bloqueio, liberando quem dependia dela.
        on_out: [completed]
        change:
          advance: encerrado
      cancelado:
        name: "Cancelado"
        agent: generic
        target-prompt: |-
          A issue cancelada e limpa: filhas canceladas, sem relações de bloqueio e sem branch remanescente.
        step-prompt: |-
          - Mova todas as issues filhas desta para 'cancelado' no board de cada uma.
          - Remova todas as relações de bloqueio desta issue.
          - Remova a branch (local e remota).
        on_out: [not_planned]
        change:
          advance: encerrado
      encerrado:
        name: "Encerrado"
        on_in: [archive]
        on_out: [-archive]

  task:
    name: "Pipe - Tasks"
    desc: "Unidade de desenvolvimento: teste → dev → review"
    todo: backlog
    priority: 2
    parallel: false
    flow: feature
    columns:
      backlog:
        name: Backlog
        change:
          advance: planning-poker
          cancelar: cancelado
      planning-poker:
        name: "Planning Poker"
        agent: tech-lead
        target-prompt: |-
          Ter a task classificada por complexidade, roteada para o agente certo.
        step-prompt: |-
          - Avalie a complexidade da task: `low` (leve, sem raciocínio profundo), `high` (muito complexa, raciocínio profundo) ou `middle` (as demais).
          - Rotule a task com `/agent-hub-<valor>`, usando exatamente `low`, `middle` ou `high`.
        change:
          advance: casos-de-teste
      casos-de-teste:
        name: "Casos de Teste"
        agent: quality
        gitevents: create
        target-prompt: |-
          Ter os casos de teste da task completos e fiéis ao escopo, prontos para o desenvolvimento.
        step-prompt: |-
          - Analise a issue e avalie os casos de teste já existentes antes de criar novos.
          - Crie ou ajuste os casos de teste seguindo o template `test-cases.md`, cobrindo o cenário descrito; faça exclusivamente o que foi pedido, sem ampliar o escopo.
          - Em dúvida simples: pergunte via chat e adicione a label 'need_human'. Em dúvida complexa ou definição ausente: crie um débito no board 'debito' (na coluna do agente que sanará a lacuna) seguindo `debito.md` e faça o débito bloquear esta task.
        change:
          advance: desenvolvimento
      desenvolvimento:
        name: "Desenvolvimento"
        agent: engineering-pl
        override-agent:
          low: engineering-jr
          middle: engineering-pl
          high: engineering-sr
        gitevents: use
        target-prompt: |-
          Ter o código da task entregue conforme o solicitado e coberto por testes, pronto para a execução de testes.
        step-prompt: |-
          - Analise a issue e os casos de teste criados; quando possível, trabalhe em TDD.
          - Desenvolva exatamente o que foi solicitado e cubra os novos códigos com testes.
          - Dúvida sobre os casos de teste: devolva ao tester avançando para revisar-caso-de-teste. Dúvida simples: pergunte via chat e adicione 'need_human'. Dúvida complexa ou definição ausente: crie um débito no board 'debito' (coluna do agente que sanará a lacuna) seguindo `debito.md` e faça o débito bloquear esta task.
        change:
          advance: execucao-testes
          revisar-caso-de-teste: casos-de-teste
      execucao-testes:
        name: "Execução de Testes"
        agent: quality
        gitevents: use
        target-prompt: |-
          Ter o veredito de teste da task registrado — aprovado, reprovado ou parcialmente reprovado — a partir da execução dos casos de teste.
        step-prompt: |-
          - Liste os casos de teste referentes ao desenvolvimento e execute-os.
          - Registre os resultados seguindo o template `test-results.md`.
          - Sucesso: avance. Reprovado ou parcialmente reprovado: avance para falha.
          - Dúvida ou ambiguidade nos casos de teste: devolva à criação de casos avançando para revisar-caso-de-teste.
          - Não altere código nem crie/altere casos de teste.
        change:
          advance: merge-request
          falha: desenvolvimento
          revisar-caso-de-teste: casos-de-teste
      merge-request:
        name: "Merge Request"
        agent: generic
        gitevents: merge
        target-prompt: |-
          Ter o merge request da issue aberto (da branch de trabalho para a branch de destino), refletindo os commits atuais.
        step-prompt: |-
          - Se já houver MR aberto para esta branch (retrabalho), não crie outro: confirme que reflete os commits atuais e prossiga.
        change:
          advance: code-review
      code-review:
        name: "Code Review"
        agent: reviewer
        target-prompt: |-
          Servir de portão de qualidade da task antes de concluir: se aprovada, MR concluído e branch removida; se reprovada, devolvida ao desenvolvimento com apontamentos.
        step-prompt: |-
          - Revise o MR: boas práticas, padrões de arquitetura, code-smell, aderência ao solicitado, ausência de delírio, se compila, cobertura de testes conforme especificado e legibilidade (baixa complexidade).
          - Aprovado: conclua o merge, exclua a branch e avance.
          - Reprovado: adicione a label 'retrabalho', anote o problema e avance para correcao.
          - Ao reanalisar, não remova a label 'retrabalho'.
        change:
          advance: concluido
          correcao: desenvolvimento
      concluido:
        name: "Concluído"
        agent: generic
        target-prompt: |-
          A issue sem nenhuma relação de bloqueio, liberando quem dependia dela.
        on_out: [completed]
        change:
          advance: encerrado
      cancelado:
        name: "Cancelado"
        agent: generic
        target-prompt: |-
          A issue cancelada e limpa: filhas canceladas, sem relações de bloqueio e sem branch remanescente.
        step-prompt: |-
          - Mova todas as issues filhas desta para 'cancelado' no board de cada uma.
          - Remova todas as relações de bloqueio desta issue.
          - Remova a branch (local e remota).
        on_out: [not_planned]
        change:
          advance: encerrado
      encerrado:
        name: "Encerrado"
        on_in: [archive]
        on_out: [-archive]

  bug:
    name: "Pipe - Bugs"
    desc: "Defeitos achados em teste/review"
    todo: backlog
    priority: 1
    parallel: false
    columns:
      backlog:
        name: Backlog
        change:
          advance: analise-tecnica
          cancelar: cancelado
      analise-tecnica:
        name: "Análise Técnica"
        agent: engineering-sr
        target-prompt: |-
          Ter um plano de correção do bug fundamentado — ou o bug bloqueado por um débito que precisa ser sanado antes.
        step-prompt: |-
          - Identifique a branch de origem (`branch pai`) e a de correção (`branch`) do bug.
          - Confirme o defeito e determine o que precisa ser corrigido.
          - Havendo débito técnico ou negocial que impeça a correção: crie um débito no board 'debito' seguindo `debito.md`, referencie este bug e faça o débito bloquear este bug.
          - Sem impedimento e com a correção clara, elabore o plano de desenvolvimento.
        change:
          advance: correcao
          cancelar: cancelado
      correcao:
        name: "Correção"
        agent: engineering-sr
        target-prompt: |-
          Ter o bug corrigido na branch de correção, com os testes existentes ainda passando, sem mesclar.
        step-prompt: |-
          - Trabalhe na branch de correção (`branch`), criada a partir da branch de origem (`branch pai`).
          - Aplique a correção garantindo que os testes existentes continuem passando.
          - Faça commit e push da branch de correção; não mescle nesta etapa.
        change:
          advance: reteste
      reteste:
        name: "Reteste"
        agent: quality
        target-prompt: |-
          Ter o veredito do reteste do bug registrado — corrigido sem regressão, ou reprovado.
        step-prompt: |-
          - Na branch de correção (`branch`), reexecute os casos de teste e valide que o bug foi corrigido sem regressão.
          - Registre os resultados seguindo o template `test-results.md`.
          - Aprovado: avance. Reprovado: avance para falha.
        change:
          advance: merge-request
          falha: correcao
      merge-request:
        name: "Merge Request"
        agent: generic
        target-prompt: |-
          Ter o merge request aberto da branch de correção (`branch`) para a branch de origem (`branch pai`), refletindo os commits atuais.
        step-prompt: |-
          - Se já houver MR aberto para essa branch (retrabalho), não crie outro: confirme que reflete os commits atuais e prossiga.
        change:
          advance: code-review
      code-review:
        name: "Code Review"
        agent: reviewer
        target-prompt: |-
          Servir de portão de qualidade da correção do bug: se aprovada, merge na branch de origem e branch de correção removida; se reprovada, devolvida à correção com apontamentos.
        step-prompt: |-
          - Revise o MR: boas práticas, padrões de arquitetura, code-smell, aderência ao solicitado, ausência de delírio, se compila, cobertura de testes conforme especificado e legibilidade (baixa complexidade).
          - Aprovado: conclua o merge na branch de origem (`branch pai`), exclua a branch de correção (`branch`) e avance.
          - Reprovado: adicione a label 'retrabalho', anote o problema e avance para correcao.
          - Ao reanalisar, não remova a label 'retrabalho'.
        change:
          advance: concluido
          correcao: correcao
      concluido:
        name: "Concluído"
        agent: generic
        target-prompt: |-
          A issue sem nenhuma relação de bloqueio, liberando quem dependia dela.
        on_out: [completed]
        change:
          advance: encerrado
      cancelado:
        name: "Cancelado"
        agent: generic
        target-prompt: |-
          A issue cancelada e limpa: filhas canceladas, sem relações de bloqueio e sem branch remanescente.
        step-prompt: |-
          - Mova todas as issues filhas desta para 'cancelado' no board de cada uma.
          - Remova todas as relações de bloqueio desta issue.
          - Remova a branch (local e remota).
        on_out: [not_planned]
        change:
          advance: encerrado
      encerrado:
        name: "Encerrado"
        on_in: [archive]
        on_out: [-archive]

  debito:
    name: "Pipe - Débitos"
    desc: "Lacunas de definição (negocial/arquitetural/humana)"
    priority: 0
    todo: humano
    parallel: false
    columns:
      humano:
        name: "Humano"
        on_in: [need_human]
        on_out: [-need_human]
      product:
        name: "Débito negocial"
        agent: product
        target-prompt: |-
          Ter o débito negocial sanado — lacuna resolvida e registrada na documentação — ou encaminhado a quem pode resolvê-lo.
        step-prompt: |-
          - Analise e resolva a lacuna de definição negocial; registre a definição na documentação pertinente.
          - Trabalhe na branch de correção (`branch`), criada a partir da branch de origem (`branch pai`); faça commit e push.
          - Se depender de definição humana, avance para humano; se depender de design/arquitetura, avance para architecture.
        change:
          advance: merge-request
          architecture: architecture
          humano: humano
      architecture:
        name: "Debito Arquitetural"
        agent: architecture
        target-prompt: |-
          Ter o débito arquitetural sanado — lacuna resolvida e registrada na documentação — ou encaminhado a quem pode resolvê-lo.
        step-prompt: |-
          - Analise e resolva a lacuna de definição arquitetural (ou o impacto de definições negociais/design na arquitetura); registre na documentação pertinente.
          - Trabalhe na branch de correção (`branch`), criada a partir da branch de origem (`branch pai`); faça commit e push.
          - Se depender de definição negocial ou de design, avance para product.
        change:
          advance: merge-request
          product: product
          humano: humano
      merge-request:
        name: "Merge Request"
        agent: generic
        target-prompt: |-
          Ter o merge request aberto da branch de correção (`branch`) para a branch de origem (`branch pai`), refletindo os commits atuais.
        step-prompt: |-
          - Se já houver MR aberto para essa branch (retrabalho), não crie outro: confirme que reflete os commits atuais e prossiga.
        change:
          advance: code-review
      code-review:
        name: "Code Review"
        agent: reviewer
        target-prompt: |-
          Servir de portão de qualidade do débito: se a definição resolve a lacuna (completa, consistente e sem contradições), merge na branch de origem; senão, devolvida à correção com apontamentos.
        step-prompt: |-
          - Verifique se a definição/documentação resolve a lacuna de forma completa, consistente com as políticas/documentações existentes e sem contradições.
          - Adequada: conclua o merge na branch de origem (`branch pai`) e avance.
          - Inadequada: NÃO crie bug (é definição/política, não código); anote o problema no comentário e avance para correcao.
          - Ao reanalisar, não remova a label 'retrabalho'.
        change:
          advance: concluido
          correcao: humano
      concluido:
        name: "Concluído"
        agent: generic
        target-prompt: |-
          A issue sem nenhuma relação de bloqueio, liberando quem dependia dela.
        on_out: [completed]
        change:
          advance: encerrado
      cancelado:
        name: "Cancelado"
        agent: generic
        target-prompt: |-
          A issue cancelada e limpa: filhas canceladas, sem relações de bloqueio e sem branch remanescente.
        step-prompt: |-
          - Mova todas as issues filhas desta para 'cancelado' no board de cada uma.
          - Remova todas as relações de bloqueio desta issue.
          - Remova a branch (local e remota).
        on_out: [not_planned]
        change:
          advance: encerrado
      encerrado:
        name: "Encerrado"
        on_in: [archive]
        on_out: [-archive]

  incidente:
    name: "Pipe - Incidente"
    desc: "Coordenação de incidente em produção"
    priority: 3
    parallel: false
    flow: docs
    todo: reportado
    columns:
      reportado:
        name: "Reportado"
        change:
          advance: registro
      registro:
        name: "Registro"
        agent: tech-lead
        gitevents: create
        target-prompt: |-
          Ter o registro do incidente rastreável e suficiente para a triagem começar sem reconstruir o que já foi dito.
        step-prompt: |-
          - Crie o documento do incidente conforme `incidente.md` em `doc/incidente/<slug>/ticket.md`, na branch de documentação (a partir da main), e vincule-o no corpo da issue.
          - Colha do reportante (via history/addcomment) o que aconteceu, quando começou, como se manifesta e o que já se sabe; trate relatos como indícios a confirmar, não fatos.
          - Onde faltar informação essencial, pergunte e sinalize com 'need_human'; não preencha lacunas por suposição.
          - Preencha APENAS o capítulo 'Registro' (descrição, data/hora, reportante, evidências, impacto observado). Não faça triagem, não classifique severidade, não investigue causa.
        change:
          advance: triagem
          cancelar: cancelado
      triagem:
        name: "Triagem"
        agent: tech-lead
        gitevents: use
        target-prompt: |-
          Ter o incidente confirmado, dimensionado e priorizado, pronto para a análise técnica.
        step-prompt: |-
          - Confirme que o problema é real e evidencie ou reproduza sua manifestação; distinga bug de erro de configuração, operação ou uso incorreto.
          - Dimensione o impacto (usuários, perda financeira, risco a dados/SLA) e classifique a severidade conforme a tabela do template.
          - Verifique e registre workaround imediato que reduza o dano enquanto a correção não chega.
          - Onde faltar dado, pergunte e sinalize com 'need_human'; não superestime nem subestime por conveniência.
          - Preencha APENAS o capítulo 'Triagem' (classificação, severidade, prioridade, workaround). Não proponha correção nem investigue causa-raiz.
        change:
          advance: analise-tecnica
          cancelar: cancelado
      analise-tecnica:
        name: "Análise Técnica"
        agent: architecture
        gitevents: use
        target-prompt: |-
          Ter um diagnóstico do incidente que permita decidir o tratamento com fundamento (causa e custo de corrigir).
        step-prompt: |-
          - Examine logs, métricas, traces, histórico de deploys e mudanças recentes correlacionadas à janela do incidente; persiga evidência, não palpite.
          - Determine a causa provável e a cadeia do defeito ao sintoma; separe causa de consequência.
          - Avalie o risco de manter e de intervir, se há workaround sustentável e a ordem de esforço de uma correção pontual.
          - Se a evidência for insuficiente, diga o que falta e sinalize com 'need_human' em vez de afirmar sem base.
          - Preencha o capítulo 'Análise técnica' com achados, causa e raciocínio. Não abra hotfix nem escolha o tratamento aqui.
        change:
          advance: decisao-tratamento
      decisao-tratamento:
        name: "Decisão de tratamento"
        agent: tech-lead
        gitevents: use
        target-prompt: |-
          Ter o tratamento do incidente decidido e materializado — em 1 a 3 hotfixes bloqueantes, ou incidente justificadamente cancelado. (Decide, não executa a correção.)
        step-prompt: |-
          - Releia registro, triagem e análise técnica e confronte-os com a documentação, especificações e políticas (internas e externas).
          - Correção imediata: abra de 1 a 3 hotfixes (idealmente 1) no board 'hotfix' (coluna de entrada), cada um seguindo `hotfix.md`, resolvendo um defeito específico e delimitado (estancar o sangramento, não reescrever arquitetura). Em cada hotfix, faça-o bloquear este incidente e defina sua branch de origem (`branch pai`) como `main`.
          - Cancelar: quando não há ação corretiva justificável.
          - Se a solução exigiria mais de 3 hotfixes ou tocar arquitetura, não é hotfix: anote-a como candidata a melhoria para o postmortem e não a abra agora.
          - Registre a decisão e a lista de hotfixes (ou a justificativa do cancelamento) no capítulo 'Ação proposta'. Não abra épicos nem tasks aqui.
        change:
          advance: aguardando-hotfix
          cancelar: cancelado
      aguardando-hotfix:
        name: "Aguardando Hotfix"
        agent: generic
        gitevents: use
        target-prompt: |-
          Manter o incidente pausado enquanto houver hotfix em andamento, sem interferir nos hotfixes.
        step-prompt: |-
          - Confira, na "Ação proposta", os hotfixes que este incidente abriu.
          - Para cada hotfix ainda aberto que não esteja bloqueando o incidente, adicione o id dele em `/blocked_by` deste incidente (o hotfix já tem id).
          - Enquanto houver hotfix aberto, não avance; quando todos concluírem, avance.
        change:
          advance: monitoramento
      monitoramento:
        name: "Monitoramento"
        # 👤 humano avalia se a correção resolveu; arrasta manualmente:
        #   RESOLVIDO -> concluido | NÃO RESOLVIDO -> reavaliacao
        on_in: [need_human]
        on_out: [-need_human]
      reavaliacao:
        name: "Reavaliação"
        agent: architecture
        gitevents: use
        target-prompt: |-
          Ter a análise técnica atualizada à luz da falha da correção anterior, sustentando uma nova decisão de tratamento mais certeira.
        step-prompt: |-
          - Levante o que foi tentado, por que se esperava que resolvesse e por que não resolveu; incorpore sintomas novos do monitoramento.
          - Revise a hipótese de causa: se caiu, proponha a próxima; se persiste, aponte por que a correção anterior foi insuficiente.
          - Atualize o capítulo 'Análise técnica' com a nova evidência e conclusão, preservando o histórico do que falhou.
          - Não abra hotfix aqui — é papel da decisão de tratamento.
        change:
          advance: decisao-tratamento
      concluido:
        name: "Concluído"
        agent: tech-lead
        gitevents: merge
        target-prompt: |-
          Ter o incidente encerrado — documentação em produção e postmortem aberto sobre o mesmo caso.
        step-prompt: |-
          - Remova todas as relações de bloqueio ainda presentes nesta issue.
          - Consolide o documento do incidente e faça o merge da branch de documentação para a main (abra o MR e conclua), versionando o histórico do caso.
          - Abra o postmortem no board 'postmortem' (coluna de entrada), referenciando este incidente (#<id>) e o diretório `doc/incidente/<slug>/`.
        on_out: [completed]
        change:
          advance: encerrado
      cancelado:
        name: "Cancelado"
        agent: generic
        target-prompt: |-
          Ter o incidente cancelado e limpo — sem bloqueios órfãos nem branches soltas.
        step-prompt: |-
          - Remova todas as relações de bloqueio desta issue.
          - Se houver hotfixes vinculados que perderam o propósito, mova-os para 'cancelado' nos seus boards.
          - Remova a branch de documentação (local e remota) se não houver conteúdo a preservar.
        on_out: [not_planned]
        change:
          advance: encerrado
      encerrado:
        name: "Encerrado"
        on_in: [archive]
        on_out: [-archive]

  hotfix:
    name: "Pipe - Hotfix"
    desc: "Correção pontual e cirúrgica em produção"
    priority: 0
    parallel: false
    flow: hotfix
    todo: backlog
    columns:
      backlog:
        name: Backlog
        change:
          advance: correcao
          cancelar: cancelado
      correcao:
        name: "Correção"
        agent: engineering-sr
        gitevents: create
        target-prompt: |-
          Ter a correção mínima do hotfix testada e publicada na branch, pronta para o reteste.
        step-prompt: |-
          - Trabalhe na branch de trabalho deste hotfix (criada a partir da `main`); não use outra.
          - Reproduza o defeito e corrija exatamente a causa do sintoma, nada além — sem refatorar, generalizar ou reescrever arquitetura (isso é épico, não hotfix).
          - Cubra a correção com teste que falhe sem o fix e passe com ele (protege contra regressão).
          - Faça commit e push da branch; não mescle nesta etapa.
          - Se a correção correta exigir mudança ampla/estrutural, não a force: registre a limitação em comentário e sinalize.
        change:
          advance: reteste
      reteste:
        name: "Reteste"
        agent: quality
        gitevents: use
        target-prompt: |-
          Ter um veredito de teste rastreável sobre a correção do hotfix (resolve o defeito sem regressão, ou reprovado).
        step-prompt: |-
          - Na branch de trabalho, execute os casos de teste pertinentes ao defeito e os testes de regressão do entorno afetado.
          - Registre os resultados conforme `test-results.md`, com evidência do antes/depois.
          - Aprovado: avance. Reprovado ou parcialmente reprovado: avance para falha, indicando o que não passou.
          - Não altere código nem crie/edite casos de teste; se inadequados, aponte na reprovação.
        change:
          advance: pre-prod
          falha: correcao
      pre-prod:
        name: "Pré produção"
        agent: tech-lead
        gitevents: use
        target-prompt: |-
          Ter a branch do hotfix pareada com a main, íntegra, e um resumo claro do que vai a produção — pronta para a homologação.
        step-prompt: |-
          - Traga a `main` para a branch do hotfix (merge) e resolva os conflitos, deixando-a coerente com produção.
          - Verifique que a correção continua presente e íntegra após a integração.
          - Descreva ao humano, objetiva e curta, o que muda e o que será implantado.
          - Mantenha enxuto — é hotfix, não épico.
        change:
          advance: homologacao
      homologacao:
        name: "Homologação"
        # 👤 humano valida o que será implantado; arrasta -> documentacao
        on_in: [need_human]
        on_out: [-need_human]
      documentacao:
        name: "Documentação"
        agent: tech-lead
        gitevents: use
        target-prompt: |-
          Ter a documentação da correção atualizada e proporcional ao hotfix, pronta para ir à main.
        step-prompt: |-
          - Atualize versão, README, documentações públicas e change files afetados, refletindo a correção.
          - Escreva do ponto de vista de quem usa ou opera, deixando claro o que muda no comportamento.
          - Mantenha proporcional ao escopo do hotfix.
        change:
          advance: merge-request
      merge-request:
        name: "Merge Request"
        agent: generic
        gitevents: merge
        target-prompt: |-
          Ter o MR da correção aberto e atualizado (branch do hotfix → `main`), pronto para revisão.
        step-prompt: |-
          - Abra o MR da branch do hotfix para a `main`, com título e descrição que resumam o defeito e a correção.
          - Se já houver MR aberto para esta branch (retrabalho), não crie outro: confirme que reflete os commits atuais e prossiga.
          - Não conclua o merge aqui — é papel do code review.
        change:
          advance: code-review
      code-review:
        name: "Code Review"
        agent: reviewer
        target-prompt: |-
          Servir de último portão antes da produção: se aprovada, correção na main; se reprovada, devolvida à correção com apontamentos.
        step-prompt: |-
          - Revise com rigor (entra direto na main): boas práticas, aderência ao defeito relatado, ausência de delírio ou escopo inflado, se compila, e se a cobertura protege contra regressão.
          - Confirme que continua sendo correção pontual e não refatoração disfarçada; hotfix que cresceu demais deve ser barrado.
          - Aprovado: conclua o merge na main, exclua a branch e avance.
          - Reprovado: adicione a label 'retrabalho', anote o que impede a aprovação e avance para correcao.
          - Ao reanalisar, não remova a label 'retrabalho'.
        change:
          advance: concluido
          correcao: correcao
      concluido:
        name: "Concluído"
        agent: generic
        target-prompt: |-
          Ter o hotfix concluído e o incidente vinculado liberado.
        step-prompt: |-
          - Remova todas as relações de bloqueio desta issue (remover o bloqueio libera o incidente vinculado).
        on_out: [completed]
        change:
          advance: encerrado
      cancelado:
        name: "Cancelado"
        agent: generic
        target-prompt: |-
          Ter o hotfix cancelado e limpo — sem bloqueios órfãos nem branch solta.
        step-prompt: |-
          - Remova todas as relações de bloqueio desta issue, liberando o que dependia dela.
          - Remova a branch (local e remota).
        on_out: [not_planned]
        change:
          advance: encerrado
      encerrado:
        name: "Encerrado"
        on_in: [archive]
        on_out: [-archive]

  postmortem:
    name: "Pipe - Postmortem"
    desc: "Análise blameless pós-incidente"
    priority: 10
    flow: docs
    todo: aberto
    columns:
      aberto:
        name: "Aberto"
        change:
          advance: coleta
      coleta:
        name: "Coleta"
        agent: tech-lead
        gitevents: create
        target-prompt: |-
          Ter a base factual do postmortem — cronologia, impacto e métricas — suficiente para investigar a causa sem reconstruir o incidente.
        step-prompt: |-
          - No diretório `doc/incidente/<slug>/` (mesmo caso), na branch de documentação (a partir da main), consolide: sumário, impacto (quem/o quê, por quanto tempo, usuários/receita/SLA) e como foi detectado.
          - Monte a linha do tempo com timestamps (detecção → escalonamento → mitigação → resolução), cruzando ticket, hotfixes e logs/deploys.
          - Calcule TTD, TTM e MTTR.
          - Descreva fatos e sequência, não culpados; não conclua causa nem proponha ação ainda.
        change:
          advance: causa-raiz
      causa-raiz:
        name: "Causa-raiz"
        agent: engineering-sr
        gitevents: use
        target-prompt: |-
          Ter o entendimento causal (causa-raiz e fatores contribuintes) que sustente ações para impedir a recorrência.
        step-prompt: |-
          - A partir da linha do tempo, aplique os 5 Porquês do sintoma às condições que o permitiram.
          - Identifique os fatores contribuintes; raramente há causa única — resista a parar no primeiro culpado técnico.
          - Distinga a causa que originou do que apenas amplificou/atrasou a resposta.
          - Registre causa-raiz e fatores no documento, com o encadeamento. Blameless: foco em sistema/processo, nunca pessoas.
        change:
          advance: licoes-acoes
      licoes-acoes:
        name: "Lições e Ações"
        agent: tech-lead
        gitevents: use
        target-prompt: |-
          Ter as lições registradas e ações corretivas claras o bastante para virar épicos sem reinterpretação.
        step-prompt: |-
          - Registre o balanço honesto: o que funcionou, o que falhou e onde só tivemos sorte.
          - Proponha ações objetivas e acionáveis, cada uma endereçando um fator contribuinte, categorizadas por: prevenir recorrência, melhorar detecção, melhorar resposta.
          - Marque quais exigem mudança estrutural (virarão épicos após a revisão humana).
          - Não crie épicos ainda.
        change:
          advance: revisao
      revisao:
        name: "Revisão"
        # 👤 reunião blameless: valida causa-raiz e ações; arrasta:
        #   HÁ AÇÕES -> criacao-melhorias | SEM AÇÕES -> concluido
        on_in: [need_human]
        on_out: [-need_human]
      criacao-melhorias:
        name: "Criação de Melhorias"
        agent: product
        gitevents: use
        target-prompt: |-
          Ter as ações estruturais aprovadas materializadas em épicos independentes, rastreáveis e bloqueando o postmortem.
        step-prompt: |-
          - Para cada ação aprovada, crie um épico no board 'epic' (coluna de entrada) seguindo `epic.md`, com contexto suficiente para ser conduzido sem consultar o incidente.
          - Em cada épico, faça-o bloquear este postmortem (mantém o postmortem em espera até a melhoria concluir).
          - Registre no documento do postmortem os épicos criados e a ação que cada um endereça.
          - Não trate os épicos como filhos do postmortem: nascem dele, mas seguem vida própria.
        change:
          advance: aguardando-melhorias
      aguardando-melhorias:
        name: "Aguardando Melhorias"
        agent: generic
        gitevents: use
        target-prompt: |-
          Manter o postmortem em espera enquanto houver épico de melhoria em andamento, sem interferir nos épicos.
        step-prompt: |-
          - Confira, no documento do postmortem, os épicos de melhoria que ele abriu.
          - Para cada épico ainda aberto que não esteja bloqueando o postmortem, adicione o id dele em `/blocked_by` deste postmortem (o épico já tem id).
          - Enquanto houver épico aberto, não avance; quando todos concluírem, avance.
        change:
          advance: concluido
      concluido:
        name: "Concluído"
        agent: tech-lead
        gitevents: merge
        target-prompt: |-
          Ter o postmortem completo em produção, fechando o ciclo do incidente.
        step-prompt: |-
          - Finalize a análise: resultado das melhorias e confirmação de que os fatores contribuintes foram endereçados (ou por que conscientemente não foram).
          - Remova todas as relações de bloqueio desta issue.
          - Faça o merge da branch de documentação do postmortem para a main (abra o MR e conclua).
        on_out: [completed]
        change:
          advance: encerrado
      cancelado:
        name: "Cancelado"
        agent: generic
        target-prompt: |-
          Ter o postmortem cancelado e limpo — sem bloqueios órfãos nem branch solta.
        step-prompt: |-
          - Remova todas as relações de bloqueio desta issue.
          - Remova a branch de documentação (local e remota) se não houver conteúdo a preservar.
        on_out: [not_planned]
        change:
          advance: encerrado
      encerrado:
        name: "Encerrado"
        on_in: [archive]
        on_out: [-archive]
