project:
  name: "Esteira Agêntica"
  summary: "Esteira de board único: uma issue anda da ideia à entrega em uma única fila — planejamento, casos de teste, desenvolvimento, execução de testes e toda a rotina de envio para a main. Portão humano leve antes do encerramento."
  humans:
    - name: Breno
      role: "dono do produto; aprova escopo e lê o resumo da entrega antes do encerramento"

sleep: 1800

log:
  dir: logs
  ttl: 60
  level: INFO

git:
  repo:
    main: git@github.com:brenodpmX/esteira-agentica.git

  flow:
    base: main

    # Fluxo único e plano: uma branch por issue, sempre da main para a main.
    # Não há épico/story/parent — cada issue é uma entrega independente.
    feature:
      prefix: feature
      branch_pattern: "feature/<id>-<slug>"
      description: Branch de desenvolvimento — uma por issue, main→main
      create: main
      merge: main


agents:
  kiro-cli:
    # Planejamento técnico + escopo (fecha o "o quê", não o "como").
    tech-lead:
      name: Isabela Gomes - Tech Lead
      model: claude-sonnet-5
    # Casos de teste e execução de testes (pytest).
    quality:
      name: Camila Rocha - Engenheira de Qualidade (QA)
      model: claude-sonnet-5
    # Desenvolvimento (agente único; ver nota de complexidade no fim do arquivo).
    engineering-pl:
      name: Sofia Carvalho - Engenheira de Software PL
      model: auto
    # Portão de qualidade antes da main.
    reviewer:
      name: Bruno Ferreira - Engenheiro de Software SR
      model: claude-sonnet-5
    # Operações: abre MR, escreve resumo, limpa cancelamentos.
    generic:
      name: Diego Santos - Analista de Operações
      model: claude-haiku-4.5


boards:
  platform: github
  rerun_cooldown: 1800

  entrega:
    name: "Esteira - Entrega"
    desc: "Fluxo único, da ideia à entrega na main"
    todo: backlog
    priority: 0
    flow: feature
    parallel: true
    columns:
      backlog:
        name: Backlog
        change:
          advance: planejamento
          cancelar: cancelado

      planejamento:
        name: "Planejamento"
        agent: tech-lead
        target-prompt: |-
          Transformar a ideia crua da issue em um escopo técnico claro e testável — o "o quê", não o "como" — a ponto de sustentar a especificação de testes e o desenvolvimento sem suposições, com o corpo da issue refletindo o escopo acordado.
        step-prompt: |-
          - Leia o corpo da issue e o histórico; identifique a mudança pedida no motor da esteira, o resultado esperado e o que muda para quem opera ou usa a esteira.
          - Onde faltar informação essencial para saber o que construir, pergunte pelo history/addcomment e sinalize a espera com `need_human`; não preencha lacunas por suposição.
          - Feche o escopo (o "o quê") e escreva os critérios de aceitação no padrão Dado/Quando/Então, testáveis isoladamente.
          - Reescreva o corpo da issue conforme o template `entrega.md`, refletindo o escopo acordado e os critérios de aceitação.
          - Não defina detalhes de implementação nem arquitetura, não crie testes, não escreva código. Prefira o simples que resolve — não amplie o escopo além do pedido.
        change:
          advance: casos-de-teste

      casos-de-teste:
        name: "Casos de Teste"
        agent: quality
        gitevents: create
        target-prompt: |-
          Ter os casos de teste da issue completos e fiéis ao escopo — derivados dos critérios de aceitação — prontos para guiar o desenvolvimento.
        step-prompt: |-
          - Analise a issue e os critérios de aceitação; avalie os testes já existentes na suíte (`tests/`) antes de criar novos.
          - Especifique os casos de teste cobrindo os cenários dos critérios de aceitação (principais e alternativos), seguindo o template `test-cases.md`.
          - Os testes são da suíte Python do motor (pytest, em `tests/`); descreva-os de forma que o desenvolvimento os implemente sem ambiguidade. Faça exclusivamente o que o escopo pede.
          - Em dúvida simples, pergunte via chat/history e sinalize com `need_human`. Se o escopo estiver incompleto ou contraditório, devolva ao planejamento avançando para revisar-escopo.
        change:
          advance: desenvolvimento
          revisar-escopo: planejamento

      desenvolvimento:
        name: "Desenvolvimento"
        agent: engineering-pl
        gitevents: use
        target-prompt: |-
          Ter o código da issue entregue conforme o escopo e coberto por testes (pytest), com a suíte passando localmente, pronto para a execução de testes.
        step-prompt: |-
          - Analise a issue e os casos de teste criados; trabalhe em TDD quando possível.
          - Implemente exatamente o que foi solicitado no motor da esteira (`src/`), respeitando a arquitetura hexagonal existente (core/adapters), e cubra os novos códigos com testes em `tests/`.
          - Rode a suíte (`python -m pytest`) e garanta que os testes relacionados passam antes de avançar. Não faça mais do que o escopo pede.
          - Dúvida sobre os casos de teste: devolva ao QA avançando para revisar-caso-de-teste. Dúvida simples: pergunte via chat e sinalize com `need_human`.
        change:
          advance: execucao-testes
          revisar-caso-de-teste: casos-de-teste

      execucao-testes:
        name: "Execução de Testes"
        agent: quality
        gitevents: use
        target-prompt: |-
          Ter o veredito de teste da issue registrado — aprovado, reprovado ou parcialmente reprovado — a partir da execução dos casos de teste, sem alterar código nem os próprios casos de teste.
        step-prompt: |-
          - Liste os casos de teste referentes ao desenvolvimento e execute a suíte (`python -m pytest`), com foco nos testes pertinentes à mudança.
          - Registre os resultados seguindo o template `test-results.md`.
          - Sucesso: avance. Reprovação (total ou parcial): faça a análise de causa e classifique — falha de código → avance para falha (volta ao desenvolvimento); caso de teste inadequado/escrito antes do código existir → avance para revisar-caso-de-teste (volta ao QA).
          - Não altere código, não crie nem altere casos de teste nesta etapa.
        change:
          advance: documentacao
          falha: desenvolvimento
          revisar-caso-de-teste: casos-de-teste

      documentacao:
        name: "Documentação"
        agent: tech-lead
        gitevents: use
        target-prompt: |-
          Ter versão, CHANGELOG e documentação pública atualizados, refletindo fielmente a mudança entregue — pré-requisito para o envio à main.
        step-prompt: |-
          - OBRIGATÓRIO (regra do motor): sempre que o código-fonte muda, faça o bump da versão em `src/core/version.py` (`VERSION = "x.y.z"`, semver — correção = patch, funcionalidade = minor). Não abra a entrega sem o bump.
          - Registre a mudança no CHANGELOG (`CHANGELOG.md`) na seção da nova versão, no mesmo padrão das entradas existentes.
          - Atualize README e documentações públicas afetadas; escreva do ponto de vista de quem usa ou opera a esteira, deixando claro o que muda no comportamento.
          - Não amplie o escopo nem documente o que não foi feito.
        change:
          advance: merge-request

      merge-request:
        name: "Merge Request"
        agent: generic
        gitevents: merge
        target-prompt: |-
          Ter o merge request da issue aberto (da branch de trabalho para a `main`), refletindo os commits atuais.
        step-prompt: |-
          - Abra o MR da branch da issue para a `main`, com título e descrição que resumam o que foi entregue.
          - Se já houver MR aberto para esta branch (retrabalho), não crie outro: confirme que reflete os commits atuais e prossiga.
          - Não conclua o merge aqui — é papel do code review.
        change:
          advance: code-review

      code-review:
        name: "Code Review"
        agent: reviewer
        target-prompt: |-
          Servir de portão de qualidade antes da integração na main: se aprovado, mudança integrada e branch removida; se reprovado, devolvida ao desenvolvimento com apontamentos claros.
        step-prompt: |-
          - Revise o MR: boas práticas, aderência à arquitetura hexagonal (core/adapters), code-smell, aderência ao escopo, ausência de delírio, se a suíte compila/passa, cobertura de testes conforme especificado, presença do bump de versão + entrada no CHANGELOG, e legibilidade (baixa complexidade).
          - Aprovado: conclua o merge na `main`, exclua a branch e avance.
          - Reprovado: adicione a label `retrabalho`, anote objetivamente o que impede a aprovação e avance para correcao.
          - Ao reanalisar, não remova a label `retrabalho`.
        change:
          advance: resumo-entrega
          correcao: desenvolvimento

      resumo-entrega:
        name: "Resumo da Entrega"
        agent: generic
        target-prompt: |-
          Ter, no addcomment da issue, um resumo claro e conciso da entrega — pronto para o dono ler antes do encerramento.
        step-prompt: |-
          - Escreva no addcomment: o que mudou no motor, os critérios de aceitação atendidos, o resultado dos testes, a nova versão e onde ver a documentação.
          - Sinalize `need_human` para que o dono leia o resumo antes do encerramento.
          - Não altere código nem documentação nesta etapa.
        change:
          advance: concluido

      concluido:
        name: "Concluído"
        agent: generic
        target-prompt: |-
          A issue sem nenhuma relação de bloqueio, liberando quem dependia dela.
        on_out: [completed]
        change:
          advance: encerrado

      cancelado:
        name: "Cancelado"
        agent: generic
        target-prompt: |-
          A issue cancelada e limpa: sem relações de bloqueio e sem branch remanescente.
        step-prompt: |-
          - Remova todas as relações de bloqueio desta issue.
          - Remova a branch (local e remota), se existir.
        on_out: [not_planned]
        change:
          advance: encerrado

      encerrado:
        name: "Encerrado"
        on_in: [archive]
        on_out: [-archive]

# --------------------------------------------------------------------------
# Notas da proposta (board único — ideia do financeiro + estilo escrevas)
# --------------------------------------------------------------------------
# - Fluxo: backlog → planejamento → casos-de-teste → desenvolvimento →
#   execucao-testes → documentacao → merge-request → code-review →
#   resumo-entrega → concluido → encerrado (+ cancelado).
# - "Estilo escrevas" aplicado: prompts em target-prompt (resultado) +
#   step-prompt (passos); ciclo de QA com devolução (revisar-caso-de-teste /
#   falha); portão de code-review antes da main; fecho via label
#   (completed/not_planned) + archive, igual ao motor atual.
# - Adaptação ao alvo (o próprio motor da esteira, em Python): testes = pytest
#   em tests/ (não Playwright); regra OBRIGATÓRIA de bump de versão em
#   src/core/version.py embutida na coluna documentacao + verificada no
#   code-review.
# - Branch: criada em casos-de-teste (gitevents: create), primeira coluna que
#   toca no git; planejamento só reescreve o corpo da issue.
# - Complexidade: um único agente de desenvolvimento (engineering-pl), como no
#   financeiro. As personas foram enxugadas para exatamente as 5 usadas
#   (tech-lead, quality, engineering-pl, reviewer, generic). Se um dia quiser o
#   roteamento por complexidade do escrevas (planning-poker + override-agent
#   jr/pl/sr via agent-hub), será preciso reintroduzir as personas engineering-sr
#   e engineering-jr.
# - Homologação humana: mantida leve (need_human no resumo-entrega), como no
#   financeiro. Se quiser um portão de homologação real (coluna dedicada com
#   on_in:[need_human]) antes do merge, é só pedir.
